<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <title>Taškų sistema</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Taškų sistema ❤️</h1>
  <div id="taskai">0</div>

  <button class="nustatymai-btn mygtukas1" onclick="rodytiArbaPasleptiNustatymus()">Nustatymai</button>

  <div id="nustatymaiSekcija" style="display: none; margin-top: 20px;">
    <h3>Nustatymai</h3>
    <label for="textureSelect">Pasirinkite mygtukų tekstūrą:</label>
    <select id="textureSelect" onchange="pakeistiMygtukuTekstura(this.value)">
      <option value="texture1">Šviesiai Mėlynas</option>
      <option value="texture2">Rožinė</option>
      <option value="texture3">Žalia</option>
    </select>
  </div>

  <br><br>

  <button onclick="rodytiArbaPasleptiIstorija()">Istorija</button>
  <div id="istorijaSekcija" style="display:none;">
    <h2>Istorija</h2>
    <div id="istorija"></div>
  </div>

  <button onclick="rodytiArbaPasleptiParduotuve()">Parduotuvė</button>
  <div id="zinute"></div>

  <div id="parduotuveSekcija" style="display:none;">
    <h2><b>Parduotuvė</b></h2>
    <div class="preke">Nugaros masažas – 5 taškai 
      <button class="tasko-mygtukas pirkti" onclick="pirkti(5)">Pirkti</button>
    </div>
    <div class="preke">Gėrimas – 3 taškai 
      <button class="tasko-mygtukas pirkti" onclick="pirkti(3)">Pirkti</button>
    </div>
    <div class="preke">Kelionė – 50 taškų 
      <button class="tasko-mygtukas pirkti" onclick="pirkti(50)">Pirkti</button>
    </div>
  </div>

  <button onclick="rodytiArbaPasleptiKainorasti()">Kainoraštis</button>
  <div id="kainorastis" style="display:none;">
    <h2><b>Kainoraštis</b></h2>
    <div class="preke">Pakloti lovą +1 taškas 
      <button class="tasko-mygtukas plius" onclick="keistiTaskus(1)">+1</button>
    </div>
    <div class="preke">Būti mandagiam +2 taškai 
      <button class="tasko-mygtukas plius" onclick="keistiTaskus(2)">+2</button>
    </div>
    <div class="preke">Pusryčiai į lovą +2 taškai 
      <button class="tasko-mygtukas plius" onclick="keistiTaskus(2)">+2</button>
    </div>
  </div>

  <button onclick="rodytiArbaPasleptiminusus()">Atimimas</button>
  <div id="atimti" style="display:none;">
    <h2><b>Už ką numinusuoti</b></h2>
    <div class="preke">Už patyčias -2 taškai 
      <button class="tasko-mygtukas minus" onclick="keistiTaskus(-2)">-2</button>
    </div>
    <div class="preke">Buvimu šaltu -3 taškai 
      <button class="tasko-mygtukas minus" onclick="keistiTaskus(-3)">-3</button>
    </div>
  </div>

  <script>
    // Firebase konfigūracija
    const firebaseConfig = {
      apiKey: "AIzaSyDSEUQ_J3TUbw0EvxNRm8jW7lE82CpxNb8",
      authDomain: "tasku-130d8.firebaseapp.com",
      databaseURL: "https://tasku-130d8-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "tasku-130d8",
      storageBucket: "tasku-130d8.appspot.com",
      messagingSenderId: "861286931659",
      appId: "1:861286931659:web:c899e1fcf782aba4514f4e",
      measurementId: "G-W9XSC0SJVJ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const taskaiRef = db.ref("taskai");

    // Atvaizduoja taškus realiu laiku
    taskaiRef.on("value", (snapshot) => {
      const value = snapshot.val();
      document.getElementById("taskai").textContent = value !== null ? value : 0;
    });

    function pakeistiMygtukuTekstura(klase) {
      document.querySelectorAll("button").forEach(btn => {
        btn.classList.remove("texture1", "texture2", "texture3");
        btn.classList.add(klase);
      });
    }

    function keistiTaskus(kiekis) {
      taskaiRef.get().then((snapshot) => {
        let dabartiniai = snapshot.val() || 0;
        let nauji = dabartiniai + kiekis;
        if (nauji < -10) {
          rodytZinute("Negalima mažiau nei –10!", "orange");
          return;
        }

        taskaiRef.set(nauji);

        const istorijaRef = db.ref("istorija");
        istorijaRef.push({
          pokytis: kiekis,
          naujaReiksme: nauji,
          laikas: new Date().toLocaleString()
        });

        rodytZinute((kiekis > 0 ? "+" : "") + kiekis + " taškai", kiekis > 0 ? "green" : "red");
      });
    }

    function rodytiIstorija() {
      const istorijaRef = db.ref("istorija");
      istorijaRef.once("value", (snapshot) => {
        const data = snapshot.val();
        const istorijaDiv = document.getElementById("istorija");
        istorijaDiv.innerHTML = ""; 

        if (data) {
          Object.values(data).reverse().forEach(entry => {
            const p = document.createElement("p");
            p.textContent = `${entry.laikas}: ${entry.pokytis > 0 ? "+" : ""}${entry.pokytis} (viso: ${entry.naujaReiksme})`;
            istorijaDiv.appendChild(p);
          });
        } else {
          istorijaDiv.textContent = "Istorija tuščia.";
        }
      });
    }

    function rodytZinute(text, color) {
      const zinute = document.getElementById("zinute");
      zinute.textContent = text;
      zinute.style.color = color;
      zinute.style.opacity = 1;
      setTimeout(() => { zinute.style.opacity = 0; }, 1500);
    }

    function rodytiArbaPasleptiIstorija() {
      const sekcija = document.getElementById("istorijaSekcija");
      sekcija.style.display = sekcija.style.display === "none" || sekcija.style.display === "" ? "block" : "none";
      if (sekcija.style.display === "block") rodytiIstorija();
    }

    function rodytiArbaPasleptiNustatymus() {
      const sekcija = document.getElementById("nustatymaiSekcija");
      sekcija.style.display = sekcija.style.display === "none" || sekcija.style.display === "" ? "block" : "none";
    }

    function rodytiArbaPasleptiParduotuve() {
      const sekcija = document.getElementById("parduotuveSekcija");
      sekcija.style.display = sekcija.style.display === "none" || sekcija.style.display === "" ? "block" : "none";
    }

    function rodytiArbaPasleptiKainorasti() {
      const sekcija = document.getElementById("kainorastis");
      sekcija.style.display = sekcija.style.display === "none" || sekcija.style.display === "" ? "block" : "none";
    }

    function rodytiArbaPasleptiminusus() {
      const sekcija = document.getElementById("atimti");
      sekcija.style.display = sekcija.style.display === "none" || sekcija.style.display === "" ? "block" : "none";
    }

    function pirkti(kaina) {
      taskaiRef.get().then((snapshot) => {
        let dabartiniai = snapshot.val() || 0;
        if (dabartiniai >= kaina) {
          taskaiRef.set(dabartiniai - kaina);
          alert("Prekė nupirkta!");
        } else {
          alert("Nepakanka taškų!");
        }
      });
    }
  </script>
</body>
</html>
